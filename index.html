<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Folder</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
  .page{width:100%;height:100vh;height:100dvh}
</style>
</head>
<body>
<div class="page">
  <div class="gf-box gf-fill">
    <div class="gf gf-blue" tabindex="0" role="img" aria-label="Folder with documents">
      <div class="gf-shadow"></div>
      <div class="gf-stage">
        <div class="gf-back"></div>
        <div class="gf-paper gf-p1"><i></i></div>
        <div class="gf-paper gf-p2"><i></i><i></i><i></i></div>
        <div class="gf-paper gf-p3"><i></i><i></i></div>
        <div class="gf-front"><div class="gf-glass"></div></div>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
